name: Evaluation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      MPLCONFIGDIR: /tmp/evaluation-mpl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m black --check src tests
      - run: python -m flake8 src tests
      - run: python -m pytest --cov=evaluation_xai
      - run: python -m evaluation_xai demo --output artifacts/ci-demo --with-shap
